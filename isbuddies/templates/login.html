{% extends 'base_auth.html' %}
{% block title %}IS Buddies | Login{% endblock %}
{% block form %}
      <form class="card auth-card" method="post" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1>Welcome back</h1>
        <p class="note">Sign in to continue</p>

        <label class="f" for="username">Username
          <input class="in" id="username" name="username" type="text" placeholder="Enter username" required autocomplete="username">
        </label>
        <label class="f" for="password">Password
          <span class="password-field">
            <input class="in" id="password" name="password" type="password" placeholder="Enter password" required autocomplete="current-password">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"/></svg>
            </button>
          </span>
        </label>

        <!-- Show errors here: invalid credentials, account locked, account pending approval -->
        <div class="auth-error" role="alert">{% for m in get_flashed_messages() %}{{ m }}<br>{% endfor %}</div>

        <button class="btn y" type="submit" style="width:100%">Login</button>
        <p class="auth-switch">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
      </form>
{% endblock %}
